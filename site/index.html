<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odd Pets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Odd Pets</h1>
        <p>A shelf for the small creatures your household keeps finding.</p>
        <div class="badge">Stored on this device</div>
    </header>
    <main>
        <div id="pet-shelf"></div>
        <form id="pet-form">
            <input type="text" id="pet-name" placeholder="Pet name">
            <input type="text" id="pet-owner" placeholder="Owner">
            <button type="submit">Put on the shelf</button>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
